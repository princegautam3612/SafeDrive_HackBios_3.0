services:
  - type: web
    name: safedrive-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safedrive-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: safedrive-frontend
    env: static
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://safedrive-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: safedrive-db
    databaseName: safedrive
    user: safedrive
    plan: free
